services:
  frontend:
    ports:
      - "127.0.0.1:${PORT}:80"
    volumes:
      - ./frontend:/app
      - uploads:/uploads
    environment:
      - NODE_ENV=development
    build:
      args:
        VITE_ENABLE_ADD_PROJECT: "true"
        VITE_ENABLE_ADMIN: "true"
    depends_on:
      - api

  api:
    volumes:
      - ./backend:/app
      - uploads:/uploads
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ENABLE_ADMIN=true

  db:
    ports:
      - "127.0.0.1:5432:5432"
