services:
  # Plus de service `proxy` ici depuis le 2026-10-06 : le Traefik est
  # partagé entre tous les sites du serveur (projet compose `edge`, dans
  # /srv/edge, maintenu depuis le dépôt infra de Red). Il vivait ici, et
  # `deploy.sh` commence par `docker compose down` : chaque déploiement du
  # portfolio aurait coupé les autres sites.
  # Le frontend rejoint le réseau `site-portfolio` (externe, créé par
  # deploy.sh s'il manque), que seul ce Traefik partage avec lui.

  frontend:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    build:
      args:
        VITE_ENABLE_ADD_PROJECT: "false"
    networks:
      - frontend
      - backend
      - site
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=site-portfolio"
      # Redirection HTTP → HTTPS
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=https-redirect"
      # HTTPS — certificat émis et renouvelé automatiquement par Traefik
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - api

  api:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ENABLE_ADD_PROJECT=false

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - db_data:/var/lib/postgresql/data
      # Voir docker-compose.yml : seul init.sql à l'init, migrations via ./migrate.sh
      - ./db/structure/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

networks:
  site:
    name: site-portfolio
    external: true
