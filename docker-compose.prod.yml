services:
  proxy:
    image: traefik:v3.0
    container_name: portfolio_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./web/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - portfolio-network

  frontend:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    build:
      args:
        VITE_ENABLE_ADD_PROJECT: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${SERVER_IP}.sslip.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
    depends_on:
      - api

  api:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ENABLE_ADD_PROJECT=false

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/structure:/docker-entrypoint-initdb.d
