services:
  proxy:
    image: traefik:v3
    container_name: portfolio_proxy
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./web/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./web/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - frontend

  certbot:
    image: certbot/certbot
    container_name: portfolio_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

  frontend:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
      - certbot_www:/var/www/certbot:ro
    build:
      args:
        VITE_ENABLE_ADD_PROJECT: "false"
    labels:
      - "traefik.enable=true"
      # Challenge ACME — HTTP uniquement, sans redirection vers HTTPS
      - "traefik.http.routers.acme.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/acme-challenge/`)"
      - "traefik.http.routers.acme.entrypoints=web"
      - "traefik.http.routers.acme.service=frontend"
      - "traefik.http.routers.acme.priority=100"
      # Redirection HTTP → HTTPS pour tout le reste
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=https-redirect"
      - "traefik.http.routers.frontend-http.priority=10"
      # HTTPS avec le certificat Certbot
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - api

  api:
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ENABLE_ADD_PROJECT=false

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/structure:/docker-entrypoint-initdb.d

volumes:
  certbot_certs:
  certbot_www:
