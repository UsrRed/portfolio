services:
  frontend:
    build:
      context: ./frontend
    networks:
      - frontend
      - backend

  api:
    build:
      context: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sécurité : mutations désactivées par défaut (activées uniquement en dev via override)
      ENABLE_ADMIN: "false"
      ENABLE_ADD_PROJECT: "false"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Seul init.sql est joué à la création du volume. Les migrations
      # (db/structure/migration_*.sql) sont appliquées par ./migrate.sh :
      # les monter ici les ferait exécuter au premier boot, et un échec
      # empêcherait PostgreSQL de démarrer (socket absente, psql en erreur).
      - ./db/structure/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      # -h 127.0.0.1 : ne pas répondre "healthy" pendant l'init du volume,
      # où un serveur temporaire (socket uniquement) exécute init.sql.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
  uploads:
