services:
  frontend:
    ports:
      - "127.0.0.1:${PORT}:80"
    build:
      args:
        VITE_ENABLE_ADD_PROJECT: "false"
    depends_on:
      - api

  api:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ENABLE_ADD_PROJECT=false

  db:
    ports:
      - "127.0.0.1:5432:5432"
